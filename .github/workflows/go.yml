name: "Build, Test & Lint"

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'data/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - 'data/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
      - 'README.MD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        # Built with the toolchain selected above so it can analyze this module's Go version.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  gosec:
    name: Security scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gosec
        # Run gosec with the toolchain selected above (mirrors the govulncheck step) so it can
        # analyze this module's Go version; the securego/gosec Docker action can ship an older Go.
        # G115 (integer overflow on conversion) is excluded repo-wide, matching the previous CI;
        # individual findings are annotated inline with #nosec.
        #
        # gosec v2.29.0 (latest) cannot build the SSA representation of a go1.27.2 module and exits
        # non-zero with "package ... has type errors" on nearly every package, despite finding zero
        # issues. Until a gosec release supports go1.27.2, run with -no-fail and gate on the real
        # finding count (Stats.found) from the JSON report: still fails on an actual finding, but
        # tolerates the SSA analysis noise.
        run: |
          out="${RUNNER_TEMP}/gosec.json"
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            -no-fail -exclude G115 -fmt json -out "$out" ./...
          found=$(jq '.Stats.found' "$out")
          echo "gosec real issues found: $found (SSA/type-error analysis noise is tolerated)"
          if [ "$found" -ne 0 ]; then
            jq -r '.Issues[] | "  \(.severity)/\(.confidence) \(.rule_id) \(.file):\(.line) \(.details)"' "$out"
            exit 1
          fi

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Build-only cross-compile of the main package for every release target so a
      # platform-specific break is caught on dev/PR, not at release.yml tag time.
      - name: Build main package (no cgo)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null .
